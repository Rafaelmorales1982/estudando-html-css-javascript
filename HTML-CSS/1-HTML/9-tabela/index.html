<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tabela</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Criando tabela</h1>
<div class="responsive-table">
    <table >
      <caption>Uma descrição para tabela</caption>
      <thead>
        <tr>
          <th>Título 1</th>
          <th>Título 2</th>
          <th>Título 3</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td colspan="2" >Corpo 1</td>
          <td>Corpo 2</td>
        </tr>

          <tr>
          <td rowspan="2">Corpo 1</td>
          <td>Corpo 2</td>
          <td>Corpo 3</td>
        </tr>

          <tr>
          <td>Corpo 1</td>
          <td>Corpo 2</td>
          
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Rodapé 1</td>
          <td>Rodapé 2</td>
          <td>Rodapé 3</td>
        </tr>
      </tfoot>

    </table>
</div>
  </body>
</html>
